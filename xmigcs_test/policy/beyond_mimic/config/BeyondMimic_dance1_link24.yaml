# dance1_easy_link24.npz, 4096 environments, 10000 iterations.
# ONNX observation order (130 dimensions):
# command 46 + motion_anchor_pos_b 3 + motion_anchor_ori_b 6 +
# base_lin_vel 3 + base_ang_vel 3 + joint_pos 23 + joint_vel 23 + actions 23.
onnx_path: dance1_10000.onnx
num_obs: 130
num_actions: 23
motor_nums: 29

# xSIM currently does not publish floating-base world position/linear velocity.
# Use reference position/velocity as a best-effort fallback for those 6 inputs.
